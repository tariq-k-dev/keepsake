version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: 'wrangler'
        versions: ['>=4.161.0, <=4.162.0']
      - dependency-name: '@cloudflare/vite-plugin'
        versions: ['>=1.69.0, <=1.69.1']
      - dependency-name: '@cloudflare/vitest-plugin'
        versions: ['>=1.8.0, <=1.8.1']
    groups:
      js-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions-all:
        patterns: ['*']
    open-pull-requests-limit: 2
