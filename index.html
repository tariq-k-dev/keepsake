<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>KEEPSAKE — a sealed-bid party game</title>
    <meta
      name="description"
      content="KEEPSAKE is a real-time party game for 2-8 players. Six heirlooms, six sealed bids, one reading of the will. Join with a room code — no account, no install."
    />
    <meta name="theme-color" content="#0e0d0b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Social preview tags.

      og:image and og:url MUST be absolute — crawlers do not resolve relative
      paths, and a relative og:image silently produces no card at all. The origin
      comes from VITE_SITE_URL (see .env) and is substituted at build time, so a
      domain change is one line rather than a sweep through this file.

      og:image:width/height are declared so the crawler can lay out the card
      before downloading the image; the asset itself is 1200x630 (generated by
      `pnpm og`), which is the ratio X, LinkedIn and Slack crop least.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KEEPSAKE" />
    <meta property="og:title" content="KEEPSAKE — a sealed-bid party game" />
    <meta
      property="og:description"
      content="Six heirlooms. Six sealed bids. Nobody shows their hand until the gavel falls. Play with 2-8 people from your own phone or laptop."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="KEEPSAKE — six heirlooms, six sealed bids, nobody shows their hand until the gavel falls."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KEEPSAKE — a sealed-bid party game" />
    <meta
      name="twitter:description"
      content="Six heirlooms. Six sealed bids. Nobody shows their hand until the gavel falls. 2-8 players, join with a 4-letter code."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
    <meta
      name="twitter:image:alt"
      content="KEEPSAKE — six heirlooms, six sealed bids, nobody shows their hand until the gavel falls."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
